name: Profile widgets

# Regenerates the README's contribution widgets every day at 18:00 UTC (23:30 IST).
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 3D contribution city (replaces the static GitHub Skyline image).
  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git commit -m "Update 3D contributions" || exit 0
          git push

  # Year calendar, habits and achievements (replaces the static wrapped.run image).
  # Requires a repo secret METRICS_TOKEN: a classic PAT with public_repo and read:user scopes.
  # Runs after contrib-3d so the two commits to master don't race.
  metrics:
    needs: contrib-3d
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          base: header, activity, community
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          plugin_achievements: yes
          plugin_achievements_display: compact
